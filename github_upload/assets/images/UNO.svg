<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <defs>
    <radialGradient id="felt" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#2f7d55"/>
      <stop offset="1" stop-color="#174a33"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <!-- 카드 한 장(가운데 정렬, 92x136) -->
    <g id="frame">
      <rect x="-46" y="-68" width="92" height="136" rx="10" fill="#fff"/>
    </g>
  </defs>

  <rect width="480" height="300" rx="18" fill="url(#felt)"/>

  <!-- 뽑을 더미 -->
  <g transform="translate(78 150) rotate(-8)" filter="url(#shadow)">
    <rect x="-46" y="-62" width="92" height="136" rx="10" fill="#1d1d1f"/>
    <rect x="-46" y="-66" width="92" height="136" rx="10" fill="#1d1d1f"/>
    <use href="#frame"/>
    <rect x="-39" y="-61" width="78" height="122" rx="7" fill="#1d1d1f"/>
    <ellipse cx="0" cy="0" rx="30" ry="46" transform="rotate(28)" fill="#e23b2e"/>
    <path d="M-14 -6 L14 -6 L0 14 Z" fill="#ffd23f"/>
  </g>

  <!-- 손에 든 카드 부채꼴 -->
  <g transform="translate(290 190)">
    <!-- 빨강 7 -->
    <g transform="rotate(-30) translate(0 -70)" filter="url(#shadow)">
      <use href="#frame"/>
      <rect x="-39" y="-61" width="78" height="122" rx="7" fill="#e23b2e"/>
      <ellipse cx="0" cy="0" rx="30" ry="46" transform="rotate(28)" fill="#fff"/>
      <text x="0" y="15" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="44" fill="#e23b2e">7</text>
      <text x="-30" y="-44" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#fff">7</text>
    </g>
    <!-- 노랑 2 -->
    <g transform="rotate(-15) translate(0 -70)" filter="url(#shadow)">
      <use href="#frame"/>
      <rect x="-39" y="-61" width="78" height="122" rx="7" fill="#f4c20d"/>
      <ellipse cx="0" cy="0" rx="30" ry="46" transform="rotate(28)" fill="#fff"/>
      <text x="0" y="15" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="44" fill="#f4c20d">2</text>
      <text x="-30" y="-44" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#fff">2</text>
    </g>
    <!-- 초록 스킵 -->
    <g transform="rotate(0) translate(0 -70)" filter="url(#shadow)">
      <use href="#frame"/>
      <rect x="-39" y="-61" width="78" height="122" rx="7" fill="#2e9e4f"/>
      <ellipse cx="0" cy="0" rx="30" ry="46" transform="rotate(28)" fill="#fff"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#2e9e4f" stroke-width="6"/>
      <line x1="-11" y1="11" x2="11" y2="-11" stroke="#2e9e4f" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- 파랑 리버스 -->
    <g transform="rotate(15) translate(0 -70)" filter="url(#shadow)">
      <use href="#frame"/>
      <rect x="-39" y="-61" width="78" height="122" rx="7" fill="#1f6fd1"/>
      <ellipse cx="0" cy="0" rx="30" ry="46" transform="rotate(28)" fill="#fff"/>
      <path d="M-14 -4 L6 -18 L6 -9 L14 -9 L14 1 L6 1 L6 10 Z" fill="#1f6fd1" transform="rotate(-30)"/>
      <path d="M14 4 L-6 18 L-6 9 L-14 9 L-14 -1 L-6 -1 L-6 -10 Z" fill="#1f6fd1" transform="rotate(-30)"/>
    </g>
    <!-- 와일드 -->
    <g transform="rotate(30) translate(0 -70)" filter="url(#shadow)">
      <use href="#frame"/>
      <rect x="-39" y="-61" width="78" height="122" rx="7" fill="#1d1d1f"/>
      <g transform="rotate(28)">
        <clipPath id="oval"><ellipse cx="0" cy="0" rx="30" ry="46"/></clipPath>
        <g clip-path="url(#oval)">
          <rect x="-30" y="-46" width="30" height="46" fill="#e23b2e"/>
          <rect x="0" y="-46" width="30" height="46" fill="#1f6fd1"/>
          <rect x="-30" y="0" width="30" height="46" fill="#f4c20d"/>
          <rect x="0" y="0" width="30" height="46" fill="#2e9e4f"/>
        </g>
        <ellipse cx="0" cy="0" rx="30" ry="46" fill="none" stroke="#fff" stroke-width="3"/>
      </g>
    </g>
  </g>
</svg>
